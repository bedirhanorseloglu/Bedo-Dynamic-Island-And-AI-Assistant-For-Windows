<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0b1325"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="cardSurface" x1="0" y1="0" x2="0" y2="262" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.105"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="0" y2="262" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 70) scale(180 120)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 70) scale(180 120)">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 70) scale(180 120)">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="310" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="310" rx="22" fill="url(#orb1)"/>
  <rect width="1200" height="310" rx="22" fill="url(#orb2)"/>
  <rect width="1200" height="310" rx="22" fill="url(#orb3)"/>

  <!-- CARD 1: RoboEyes & BedoStage -->
  <g transform="translate(28, 24)">
    <rect width="364" height="262" rx="22" fill="url(#cardSurface)" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <line x1="24" y1="1.5" x2="340" y2="1.5" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1"/>

    <!-- Mini Glass Stage -->
    <rect x="22" y="22" width="320" height="106" rx="16" fill="#0B1221" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="182" cy="75" r="34" fill="#111A2E" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="167" y="61" width="10" height="24" rx="5" fill="#67E8F9">
      <animate attributeName="height" values="24;24;2;24;24" keyTimes="0;0.84;0.89;0.94;1" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="61;61;72;61;61" keyTimes="0;0.84;0.89;0.94;1" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="187" y="61" width="10" height="24" rx="5" fill="#67E8F9">
      <animate attributeName="height" values="24;24;2;24;24" keyTimes="0;0.84;0.89;0.94;1" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="61;61;72;61;61" keyTimes="0;0.84;0.89;0.94;1" dur="3.8s" repeatCount="indefinite"/>
    </rect>

    <text x="24" y="164" fill="#F8FAFC" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="16" font-weight="700">Synced RoboEyes &amp; Stage</text>
    <text x="24" y="188" fill="#94A3B8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5">Synchronized blinking, reactive moods,</text>
    <text x="24" y="206" fill="#94A3B8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5">and spring-physics morphing from</text>
    <text x="24" y="224" fill="#94A3B8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5">idle pill to full command center.</text>
  </g>

  <!-- CARD 2: Media Player & Frosted Clock -->
  <g transform="translate(418, 24)">
    <rect width="364" height="262" rx="22" fill="url(#cardSurface)" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <line x1="24" y1="1.5" x2="340" y2="1.5" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1"/>

    <rect x="22" y="22" width="320" height="106" rx="16" fill="#131022" fill-opacity="0.68" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <!-- Frosted Clock + Visualizer -->
    <text x="42" y="84" fill="#FFFFFF" fill-opacity="0.92" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">17:20</text>
    <rect x="150" y="54" width="170" height="42" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="166" y="73" fill="#F8FAFC" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="600">Apple Music Glass</text>
    <text x="166" y="88" fill="#F472B6" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="10.5" font-weight="500">Ambient Artwork Glow</text>

    <text x="24" y="164" fill="#F8FAFC" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="16" font-weight="700">Frosted Clock &amp; Media HUD</text>
    <text x="24" y="188" fill="#94A3B8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5">Apple Music-inspired translucent player</text>
    <text x="24" y="206" fill="#94A3B8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5">with ambient cover glow, SMTC</text>
    <text x="24" y="224" fill="#94A3B8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5">controls, and G-Helper live HUDs.</text>
  </g>

  <!-- CARD 3: AI Agent Command Center -->
  <g transform="translate(808, 24)">
    <rect width="364" height="262" rx="22" fill="url(#cardSurface)" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <line x1="24" y1="1.5" x2="340" y2="1.5" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1"/>

    <rect x="22" y="22" width="320" height="106" rx="16" fill="#0B1324" fill-opacity="0.68" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <!-- 2x2 Agent Pills -->
    <rect x="36" y="36" width="138" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="52" cy="52" r="4" fill="#F97316"/>
    <text x="64" y="56" fill="#E2E8F0" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="600">Claude Code</text>

    <rect x="186" y="36" width="142" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="202" cy="52" r="4" fill="#22C55E"/>
    <text x="214" y="56" fill="#E2E8F0" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="600">OpenAI Codex</text>

    <rect x="36" y="78" width="138" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="52" cy="94" r="4" fill="#38BDF8"/>
    <text x="64" y="98" fill="#E2E8F0" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="600">Gemini CLI</text>

    <rect x="186" y="78" width="142" height="32" rx="16" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.35"/>
    <circle cx="202" cy="94" r="4" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="214" y="98" fill="#FFFFFF" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="600">Antigravity IDE</text>

    <text x="24" y="164" fill="#F8FAFC" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="16" font-weight="700">AI Agent Hooks &amp; Focus</text>
    <text x="24" y="188" fill="#94A3B8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5">Real-time activity hooks for 4 coding</text>
    <text x="24" y="206" fill="#94A3B8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5">agents with one-click jump directly</text>
    <text x="24" y="224" fill="#94A3B8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5">into the exact IDE chat window.</text>
  </g>
</svg>
